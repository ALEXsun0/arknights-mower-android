name: Android host tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-host-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Host Android regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android test tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test checked-in Android source
        run: bash android/gradlew -p android :app:testDebugUnitTest --console=plain
      - name: Upload Android test failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest
            android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

  python:
    name: Host Python regression
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Python image from checked-in dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/runtime.Dockerfile
          platforms: linux/arm64
          tags: mower-android-host-tests:dev
          load: true
          cache-from: type=gha,scope=android-host-tests
          cache-to: type=gha,mode=max,scope=android-host-tests
      - name: Test checked-in host and Mower source
        run: docker run --rm --platform linux/arm64 -v "$PWD:/project" -w /project mower-android-host-tests:dev python -m unittest discover -s tests -v

  webui:
    name: Host WebUI regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: runtime/ui/package-lock.json
      - name: Test checked-in WebUI source
        working-directory: runtime/ui
        run: |
          npm ci --no-audit --no-fund
          npm run test -- src/routes.test.js src/theme/mower.test.js src/utils/manualUpdate.test.js src/components/GlobalUpdateDrop.test.js src/components/SoftwareComponentUpdates.test.js src/components/SoftwareUpdate.test.js
